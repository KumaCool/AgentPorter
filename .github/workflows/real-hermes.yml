name: Real Hermes acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-hermes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Immutable upstream commit whose pyproject.toml declares version 0.20.0.
      HERMES_REF: 3c27eb6234bf91b8ceee9e9071591b31e9b148cb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install AgentPorter and test tools
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Install isolated Hermes executable at acceptance path
        shell: bash
        run: |
          ACCEPTANCE_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          sudo mkdir -p /usr/local/lib/hermes-agent
          sudo rm -rf /usr/local/lib/hermes-agent/venv
          sudo "${ACCEPTANCE_PYTHON}" -m venv /usr/local/lib/hermes-agent/venv
          sudo /usr/local/lib/hermes-agent/venv/bin/python -m pip install --disable-pip-version-check "hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git@${HERMES_REF}"
          /usr/local/lib/hermes-agent/venv/bin/python -c "import importlib.metadata; assert importlib.metadata.version('hermes-agent') == '0.20.0'"
          /usr/local/lib/hermes-agent/venv/bin/hermes --version
      - name: Run real Hermes acceptance without credentials or model calls
        run: >-
          python -m pytest -q
          tests/test_phase3_real_hermes.py
          tests/test_phase4_real_hermes.py
          tests/test_phase5_formal_acceptance.py
