name: Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install --disable-pip-version-check -e . pytest pyright ruff build
      - name: Format
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m pyright
      - name: Offline tests
        if: runner.os != 'Windows'
        run: >-
          python -m pytest
          --ignore=tests/test_phase3_real_hermes.py
          --ignore=tests/test_phase4_real_hermes.py
          --ignore=tests/test_phase5_formal_acceptance.py
          --ignore=tests/test_phase5_stress_acceptance.py
      - name: Windows package contract
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_packaging_contract.py tests/test_release_verifier.py
      - name: Build distributions
        run: python -m build
