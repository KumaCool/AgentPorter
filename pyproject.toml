[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentporter"
dynamic = ["version"]
description = "Hermes-first portable Worker profile installer"
readme = "README.md"
license = "MIT"
authors = [{name = "AgentPorter contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7"]

[project.urls]
Homepage = "https://github.com/KumaCool/AgentPorter"
Repository = "https://github.com/KumaCool/AgentPorter"
Issues = "https://github.com/KumaCool/AgentPorter/issues"

[dependency-groups]
dev = ["pytest>=9,<10", "pyright>=1.1.411,<2", "ruff>=0.12,<1"]

[project.scripts]
agentporter = "agentporter:main"
agentporter-uninstall = "agentporter.uninstall_entry:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "agentporter.__version__"}

[tool.setuptools.package-data]
"agentporter.resources" = ["workers.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "scripts", "install.py", "uninstall.py"]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
